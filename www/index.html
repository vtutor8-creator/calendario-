body{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px;font-family:'Montserrat','Segoe UI',sans-serif;color:var(--txt)}

.cal{width:100%;max-width:460px;aspect-ratio:328/427;display:grid;grid-template-columns:68fr 17fr 70fr 16fr 71fr 16fr 70fr;grid-template-rows:repeat(61,1fr);background:var(--bg)}
.d{position:relative;border:2px solid var(--bg);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:filter .2s,transform .2s;font:inherit}
.d:hover{filter:brightness(1.05);z-index:2}
.d .n{position:absolute;top:2%;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(1.6rem,8vw,2.6rem);line-height:1}
.d.l .n{left:8%}.d.r .n{right:8%}
.d .e{font-size:clamp(1.4rem,7vw,2.4rem);margin-top:22%}
.d.open .e{filter:grayscale(.2);opacity:.55}
.d.open::after{content:"✓";position:absolute;bottom:4%;right:8%;font-weight:800;opacity:.7}
.red{background:var(--red);color:#fff}.green{background:var(--green);color:#fff}
.yellow{background:var(--yellow);color:var(--red)}.pink{background:var(--pink);color:var(--red)}
.bar{margin-top:16px;width:100%;max-width:460px;min-height:56px;padding:10px 14px;text-align:center;font-weight:600;background:var(--card);border:1px dashed var(--ink);border-radius:10px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;line-height:1.35}
.bar a{color:var(--ink);font-size:.8rem;margin:0 6px}
.bar small{font-weight:600;opacity:.75}
button.reset{margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:30px;padding:10px 26px;font:800 .8rem 'Montserrat',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.reset{color:#2a2320}}
.sub{max-width:460px;text-align:center;font-size:.85rem;margin:-6px 0 16px;opacity:.85;line-height:1.4}
.d.lock .e{filter:grayscale(1);opacity:.45}
.d.lock::after{content:"🔒";position:absolute;bottom:4%;right:8%;font-size:.9rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.mc{background:var(--card);color:var(--txt);max-width:380px;width:100%;border-radius:18px;padding:24px 20px;text-align:center;border:3px solid var(--red);animation:pop .35s ease-out;max-height:90vh;overflow:auto}
.mc .big{font-size:3.2rem;line-height:1}.mc h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:2rem;letter-spacing:2px;color:var(--red);margin:4px 0 10px}
.mc p{margin:9px 0;font-size:.92rem;line-height:1.4}.mc .fr{font-weight:800;font-size:1.02rem}.mc .fin{background:var(--yellow);color:var(--red);border-radius:12px;padding:12px;font-weight:800}
.mc a{color:var(--red);font-weight:800;margin-left:4px}.mc button{margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:30px;padding:9px 24px;font:800 .8rem 'Montserrat',sans-serif;cursor:pointer}
.cf{position:fixed;top:-30px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.d.hoy{box-shadow:inset 0 0 0 4px #fff;animation:pul 1.4s infinite}
@keyframes pul{50%{filter:brightness(1.25)}}
.cf.sn{animation-iteration-count:infinite;z-index:1}
.d25{margin-top:12px;width:100%;max-width:460px;border:0;border-radius:14px;padding:14px;font:800 .95rem 'Montserrat',sans-serif;background:var(--red);color:#fff;cursor:pointer;letter-spacing:.5px}
.d25[hidden]{display:none}
.d25.lock{background:#8a7a72;opacity:.85}.d25.pulse{animation:pul 1.4s infinite}
.mc .btn{display:block;width:100%;margin:8px 0}.mc ol{text-align:left;font-size:.8rem;margin:8px 0 8px 22px;max-height:150px;overflow:auto}
</style>

if(m&&m.src)return '<audio controls preload="none" src="'+m.src+'" style="width:100%"></audio>';
if(m&&m.yt)return '<iframe width="100%" height="190" src="https://www.youtube-nocookie.com/embed/'+m.yt+'?playsinline=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen style="border:0;border-radius:12px"></iframe><small><a href="https://www.youtube.com/watch?v='+m.yt+'" target="_blank" rel="noopener">¿No carga? Ábrelo en YouTube</a></small>';
return '<p><a href="'+yt(t)+'" target="_blank" rel="noopener">▶ escuchar</a></p>'}
function showModal(i,x,s){const m=document.createElement('div');m.className='ov';m.innerHTML='<div class="mc"><div class="big">'+x[4]+'</div><h2>Día '+(i+1)+'</h2><p class="fr">💌 '+F[i]+'</p><p>🎵 '+s[0]+'</p>'+player(i,s[0])+'<p>📖 '+s[1]+'</p><p>🎁 Plan del día: '+x[5]+'</p>'+(i==23?'<p class="fin">Este calendario fue mi forma de decirte que me importas. ¡Feliz Navidad! 🎄'+(DE?'<br>— '+DE:'')+'</p>':'')+'<button>Cerrar</button></div>';m.onclick=e=>{if(e.target===m||e.target.tagName==='BUTTON')m.remove()};document.body.appendChild(m);confetti(i==23?70:14)}
const hoyIdx=()=>{const n=new Date();return(!TEST&&n.getMonth()===11&&n.getDate()<=25)?n.getDate()-1:-1};
function upd(){const n=new Date(),y=n.getMonth()<5?n.getFullYear()-1:n.getFullYear(),d=Math.ceil((new Date(y,11,1)-n)/864e5);let t='🎁 Has abierto '+open.length+' de 24';if(!TEST&&d>0)t='⏳ Faltan '+d+(d==1?' día':' días')+' para el primer regalo';document.getElementById('cnt').textContent=t}
document.addEventListener('securitypolicyviolation',e=>{if(/youtube/.test(e.blockedURI||'')){document.querySelectorAll('.mc iframe').forEach(f=>{const m=(f.src.match(/embed\/([\w-]+)/)||[])[1];if(f.nextElementSibling)f.nextElementSibling.remove();f.outerHTML='<p><a href="https://www.youtube.com/watch?v='+m+'" target="_blank" rel="noopener">▶ Escuchar en YouTube</a></p>'})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.ov');if(o)o.remove()}});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let k=0;k<16;k++){const e=document.createElement('span');e.className='cf sn';e.textContent='❄️';e.style.left=Math.random()*100+'vw';e.style.fontSize=(10+Math.random()*10)+'px';e.style.opacity=.5;e.style.animationDuration=(9+Math.random()*8)+'s';e.style.animationDelay=(-Math.random()*12)+'s';document.body.appendChild(e)}
(function(){const m=document.createElement('div');m.className='ov';m.innerHTML='<div class="mc"><div class="big">💌</div><h2>Tienes un regalo</h2><p>'+(NOMBRE?'Para <b>'+NOMBRE+'</b>. ':'')+'Hay un detalle para cada día de diciembre: una canción, un libro y unas palabras para ti.</p><button>Abrir mi calendario</button></div>';m.onclick=e=>{if(e.target.tagName==='BUTTON'){m.remove();confetti(30)}};document.body.appendChild(m)})();
function plIds(){return[...new Set(Object.keys(MEDIA).sort((a,b)=>a-b).map(k=>MEDIA[k].yt).filter(Boolean))]}
const plUrl=()=>'https://www.youtube.com/watch_videos?video_ids='+plIds().join(',');
function plTexto(){return 'Playlist del calendario de Adviento\n\n'+SONGS.map((s,i)=>(i+1)+'. '+s+(MEDIA[i+1]&&MEDIA[i+1].yt?'\nhttps://www.youtube.com/watch?v='+MEDIA[i+1].yt:'')).join('\n\n')+'\n\nPlaylist completa: '+plUrl()}
function copiar(b){const t=plTexto();const ok=()=>{b.textContent='✅ ¡Copiada!'};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok).catch(()=>prompt('Copia la lista:',t));else prompt('Copia la lista:',t)}
function showD25(){const m=document.createElement('div');m.className='ov';m.innerHTML='<div class="mc"><div class="big">🎁</div><h2>Día 25 · Feliz Navidad</h2><p class="fr">💌 Esta es tu playlist completa: todo lo que sonó en estos días, para que se quede contigo.</p><ol>'+SONGS.map(x=>'<li>'+x+'</li>').join('')+'</ol><button class="btn" id="pl1">▶ Abrir playlist en YouTube</button><button class="btn" id="pl2">📋 Copiar lista</button>'+(navigator.share?'<button class="btn" id="pl3">📤 Compartir</button>':'')+'<button class="btn" id="plc">Cerrar</button></div>';m.onclick=e=>{if(e.target===m||e.target.id==='plc')m.remove()};document.body.appendChild(m);
document.getElementById('pl1').onclick=()=>window.open(plUrl(),'_blank');
document.getElementById('pl2').onclick=function(){copiar(this)};
const p3=document.getElementById('pl3');if(p3)p3.onclick=()=>navigator.share({title:'Playlist de Adviento',text:plTexto()}).catch(()=>{})}
function d25ui(){const b=document.getElementById('d25'),lk=locked(24);b.hidden=lk;b.className='d25'+(lk?' lock':(hoyIdx()===24?' pulse':''));b.textContent=lk?'🔒 Día 25 · Sorpresa de Navidad (se abre el 25 de diciembre)':'🎁 Día 25 · ¡Tu sorpresa de Navidad!'}
document.getElementById('d25').onclick=()=>{if(locked(24)){bar.textContent='🔒 La sorpresa final se abre el 25 de diciembre';return}showD25();confetti(90)};
async function notis(){try{const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN)return;
const p=await LN.requestPermissions();if(p.display!=='granted')return;
if(TEST){await LN.schedule({notifications:[{id:999,title:'🎄 Notificación de prueba',body:'Así te avisará cada día a las '+HORA+':00 ✨',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});return}
const n=new Date(),y=n.getMonth()<5?n.getFullYear()-1:n.getFullYear(),list=[];
for(let d=1;d<=25;d++){const at=new Date(y,11,d,HORA,0,0);if(at>n)list.push({id:d,title:d==25?'🎄 ¡Feliz Navidad!':D[d-1][4]+' Día '+d+' de tu calendario',body:d==25?(NOMBRE?NOMBRE+', ':'')+'abre tu calendario: hoy hay algo más 💌':(NOMBRE?NOMBRE+', ':'')+'tu canción, tu libro y unas palabras de hoy te esperan 💌',schedule:{at,allowWhileIdle:true}})}
await LN.cancel({notifications:Array.from({length:25},(_,i)=>({id:i+1}))});
if(list.length)await LN.schedule({notifications:list})}catch(e){}}
const cal=document.getElementById('cal'),bar=document.getElementById('bar');
let open=[];
try{open=JSON.parse(localStorage.getItem('adv')||'[]')}catch(e){}
function save(){try{localStorage.setItem('adv',JSON.stringify(open))}catch(e){}}
function render(){
  cal.innerHTML='';
  D.forEach((x,i)=>{
    const b=document.createElement('button');
    b.className='d '+x[0]+' '+x[3]+(open.includes(i)?' open':'')+(locked(i)&&!open.includes(i)?' lock':'')+(hoyIdx()===i?' hoy':'');
    b.style.gridColumn=x[1];b.style.gridRow=x[2];
    b.setAttribute('aria-label','Día '+(i+1));
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="e">'+x[4]+'</span>';
    b.onclick=()=>{
      if(locked(i)){bar.textContent='🔒 Este día se abre el '+(i+1)+' de diciembre';return}
      if(!open.includes(i)){open.push(i);save();b.classList.add('open')}
      const s=S3[i];
      bar.innerHTML='<div>'+x[4]+' <b>Día '+(i+1)+'</b> · <small>'+x[5]+'</small></div>'
        +'<div>🎵 '+s[0]+' <a href="'+yt(s[0])+'" target="_blank" rel="noopener">▶ escuchar</a></div>'
        +'<div>📖 '+s[1]+'</div>';
      showModal(i,x,s);upd();
    };
    cal.appendChild(b);
  });
}
document.getElementById('reset').onclick=()=>{open=[];save();render();upd();bar.textContent='👆 Toca un día para descubrir la sorpresa'};
render();upd();d25ui();notis();
</script>
